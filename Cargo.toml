[package]
name = "keyhole"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Personal zero-knowledge secret store. The file is ciphertext. Unlock stays on your machine."
readme = "README.md"
publish = false

[dependencies]
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
